<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="我的课程导航 — 课件、录播、论文清单与作业仓库汇总">
<title>课程导航</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="assets/style.css">
<script>
/* 在首屏绘制前套用主题，避免闪白 */
(function () {
  try {
    var m = localStorage.getItem('courses.theme');
    if (m !== 'light' && m !== 'dark') m = 'auto';
    document.documentElement.setAttribute('data-theme-mode', m);
    if (m !== 'auto') document.documentElement.setAttribute('data-theme', m);
  } catch (e) {
    document.documentElement.setAttribute('data-theme-mode', 'auto');
  }
})();
</script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">
    <span class="brand-mark">📚</span>
    <span class="brand-text">课程导航</span>
  </a>

  <nav class="course-tabs" id="courseTabs" aria-label="课程切换"></nav>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="search" placeholder="搜索讲次 / 论文" autocomplete="off" spellcheck="false" aria-label="搜索讲次或论文">
    <kbd class="search-kbd">/</kbd>
  </div>

  <button class="icon-btn" id="themeBtn" aria-label="切换主题" title="切换主题">
    <svg class="ico-auto" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/></svg>
    <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/></svg>
  </button>
</header>

<main class="wrap" id="root">
  <p class="loading">正在载入课程数据…</p>
</main>

<noscript>
  <p class="wrap">这个页面需要 JavaScript 才能显示课程数据。</p>
</noscript>

<script src="data/courses.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
